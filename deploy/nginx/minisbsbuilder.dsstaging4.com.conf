# minisbsbuilder.dsstaging4.com
#
# Install:
#   sudo cp deploy/nginx/minisbsbuilder.dsstaging4.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/minisbsbuilder.dsstaging4.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d minisbsbuilder.dsstaging4.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app is a single Node process on 127.0.0.1:4174 that serves both the client
# bundle and /api/brief. There is no static root here on purpose: the app sets
# its own cache headers, and a second copy of the bundle on disk is a second
# thing to get out of date.

upstream minisbsbuilder {
    server 127.0.0.1:4174;
    # Reuse upstream connections. The app's keepAliveTimeout is 65s, longer than
    # this pool's idle life, so nginx always closes first and a reused socket is
    # never one the app is shutting down.
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name minisbsbuilder.dsstaging4.com;

    # Leave the ACME path reachable over plain HTTP for renewals.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minisbsbuilder.dsstaging4.com;

    # certbot rewrites these three lines when it issues the certificate.
    ssl_certificate     /etc/letsencrypt/live/minisbsbuilder.dsstaging4.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minisbsbuilder.dsstaging4.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The brief can be a whole discovery document (16,000 characters) and an
    # export round trip carries the page tree. The app enforces its own 128 KB
    # JSON limit; this only stops nginx rejecting first with a bare 413.
    client_max_body_size 2m;

    access_log /var/log/nginx/minisbsbuilder.access.log;
    error_log  /var/log/nginx/minisbsbuilder.error.log;

    # The app already gzips every text response, so nginx must pass the encoded
    # body straight through rather than trying to compress it a second time.
    gzip off;

    # Cheap liveness probe. Kept out of the access log so a 30-second monitor
    # does not bury real traffic.
    location = /healthz {
        access_log off;
        proxy_pass http://minisbsbuilder;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Drafting a whole page's copy is one HTTP request that waits on a language
    # model. OLLAMA_TIMEOUT_MS is 180s, so nginx must outlast it — the default
    # 60s read timeout turns a working job into a 504 two thirds of the way in.
    location /api/ {
        proxy_pass http://minisbsbuilder;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin must survive intact: the API checks it against
        # PUBLIC_APP_ORIGIN and rejects a mismatch with 403.
        proxy_set_header Origin            $http_origin;

        proxy_connect_timeout 10s;
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://minisbsbuilder;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
