# The gate. Runs on every pull request and every push to main, and is called by
# deploy-staging.yml so nothing reaches the staging URL that has not passed it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Playwright is a devDependency used only by the browser suite, which runs
      # in its own workflow. No browser binary is needed to test or build.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # A style profile the compiler would have to guess about at render time is
      # worse than no profile, so the catalogue is validated before anything else.
      - name: Validate style catalogue
        run: npm run styles:validate

      - name: Unit, integration and security tests
        run: npm test

      - name: Concept isolation
        run: npm run qa:concepts

      - name: Build client bundle
        run: npm run build

      # Proves the exact file set the container and the release directory copy is
      # complete and boots: bundle present, health and readiness answering.
      - name: Production smoke test
        run: |
          NODE_ENV=production HOST=0.0.0.0 PORT=4174 \
          PUBLIC_APP_ORIGIN=https://minisbsbuilder.dsstaging4.com \
          TRUST_PROXY=loopback node scripts/check-env.mjs

          NODE_ENV=production HOST=127.0.0.1 PORT=4174 \
          PUBLIC_APP_ORIGIN=http://127.0.0.1:4174 \
          node server/index.mjs & echo $! > server.pid
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:4174/readyz | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:4174/api/brief/status >/dev/null
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:4174/ | grep -q 200
          kill -TERM "$(cat server.pid)"

      # Reported, not enforced: a new advisory against a transitive dependency
      # should be visible on the next run without blocking an unrelated deploy.
      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
